name = "emma-api"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "emma-submissions"
database_id = "f2168e2e-b2f5-4fc9-94e2-9df8a3ca95fe" # Replace with actual D1 database ID

# KV namespace for schema caching
# [[kv_namespaces]]
# binding = "SCHEMA_CACHE"
# id = "" # Replace with actual KV namespace ID

# Environment variables
[vars]
ENVIRONMENT = "production"
RATE_LIMIT_REQUESTS = "5"
RATE_LIMIT_WINDOW = "60" # seconds
MAX_SUBMISSION_SIZE = "10000" # bytes
CDN_URL = "" # Base URL for form schemas (e.g., https://forms.example.com)

# CORS allowed origins (comma-separated)
ALLOWED_ORIGINS = "*" # Change to specific domains in production

# Development environment
[env.development]
name = "emma-api-dev"
[env.development.vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "*"

# Staging environment
[env.staging]
name = "emma-api-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

# Production environment
[env.production]
name = "emma-api"
[env.production.vars]
ENVIRONMENT = "production"
