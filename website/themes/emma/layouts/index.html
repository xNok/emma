{{ define "main" }}
  <div class="hero">
    <h1>Welcome to Emma!</h1>
    <p>An embeddable forms system for Hugo using Cloudflare.</p>
  </div>
  <div>
    <h2>Recent Posts</h2>
    <ul>
      {{ range first 5 .Site.RegularPages }}
        <li>
          <a href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
